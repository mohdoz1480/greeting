<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بطاقة تهنئة رقمية</title>
    <style>
        /* تصميم كلاسيكي نظيف يظهر عملك اليدوي المتقن */
        body {
            background-color: #f5f6fa;
            color: #2f3640;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .card-container {
            background-color: white;
            max-width: 550px;
            margin: 0 auto;
            padding: 35px;
            border: 2px solid #353b48;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2f3542;
            border-bottom: 2px solid #718093;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.25rem;
            line-height: 1.8;
            color: #57606f;
        }
        .highlight {
            color: #20bf6b;
            font-weight: bold;
        }
        .footer-note {
            margin-top: 40px;
            font-size: 0.95rem;
            color: #95a5a6;
            border-top: 1px dashed #dcdde1;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1>✉️ بطاقة تهنئة مخصص  لشخص خاص</h1>
        
        <p>أهلاً بك، أحببت أن أرسل لك هذه الرسالة الرقمية عبر رابط موقعي الخاص.</p>
        
        <p>أتمنى لك يوماً سعيداً، وأسأل الله أن يملأ أيامك كلها <span class="highlight">بالفرح والنجاح والصحة الدائمة</span>.</p>
        
        <p>شكراً لدعمك وسؤالك الدائم عني،.</p>

        <div class="footer-note">
            تمت البرمجة والتصميم بواسطة: <strong>محمد المبرمج</strong> 💻
        </div>
    </div>

</body>
</html>
